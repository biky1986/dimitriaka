<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Τα μέρη του σιταριού</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap">
<style>
/*
VOICE: ζεστό, παιχνιδιάρικο, σαν σελίδα παιδικού βιβλίου
IDEA: πίνακας εργαστηρίου όπου κολλάς ετικέτες πάνω στο φυτό
PICTURE: η ακουαρέλα του σιταριού με αριθμημένες πινέζες
COLOUR and TYPE: κρεμ περγαμηνή, καφέ μελάνι, φασκομηλί πράσινο, Comfortaa
LAYOUT: τίτλος, εικόνα αριστερά και λέξεις δεξιά, στο κινητό η μία κάτω από την άλλη
*/
:root{color-scheme:light;--bg:#efe4cc;--card:#f8f1e2;--ink:#4a3022;--line:#c4ac8a;--g:#c4d6b2;--gd:#6e8c5c;--ok:#5f8a4c;--bad:#b5533c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Comfortaa,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,32px)}
h1{font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 18px;font-size:17px}
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.board{position:relative;border-radius:18px;overflow:hidden;border:6px solid var(--card);box-shadow:0 6px 18px rgba(80,55,30,.25)}
.board img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:3px solid var(--card);background:var(--gd);color:#fff;font:700 17px Comfortaa,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3);padding:0}
.pin.armed{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
.pin:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tag{position:absolute;transform:translateY(-50%);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
.tag.r{margin-left:24px}.tag.l{transform:translate(-100%,-50%);margin-left:-24px}
.tag.ok{border-color:var(--ok);background:#e3eed8}.tag.bad{border-color:var(--bad);background:#f6dcd4}
.side{background:var(--card);border-radius:18px;padding:18px;border:2px solid var(--line)}
.side h2{font-size:19px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:52px}
.chip{font:700 17px Comfortaa,sans-serif;color:var(--ink);background:#fff8ea;border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer}
.chip.sel{background:var(--g);border-color:var(--gd);transform:translateY(-2px)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font:700 17px Comfortaa,sans-serif;border:0;border-radius:12px;padding:12px 20px;min-height:44px;cursor:pointer;background:var(--gd);color:#fff}
.btn.alt{background:#fff8ea;color:var(--ink);border:2px solid var(--line)}
.msg{margin-top:16px;font-size:17px;font-weight:700;min-height:26px}
.msg.win{color:var(--ok);font-size:22px}
.help{font-size:14px;margin-top:14px;opacity:.85}
@media(max-width:760px){.game{grid-template-columns:minmax(0,1fr)}.tag{font-size:13px;padding:3px 7px}.pin{width:32px;height:32px;font-size:15px}}
@media(prefers-reduced-motion:reduce){.pin.armed{animation:none;outline:3px solid var(--ink)}}
</style>
</head>

 {w:'στάχυ',x:27.6,y:19.5,s:'r'},
 {w:'φύλλα',x:38.6,y:52.1,s:'r'},
 {w:'καλάμι',x:26.2,y:61.2,s:'r'},
 {w:'ρίζες',x:26.9,y:85.9,s:'r'},
 {w:'άγανα',x:63.5,y:35.5,s:'l'},
 {w:'σταχύδια',x:75.7,y:36.5,s:'r'},
 {w:'ράχη',x:72.9,y:74.5,s:'r'}
];
const board=document.getElementById('board'),chipsEl=document.getElementById('chips'),msg=document.getElementById('msg');
let placed={},sel=null;
const order=T.map((_,i)=>i).sort(()=>Math.random()-.5);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
let words=shuffle(T.map(t=>t.w));
function render(){
  board.querySelectorAll('.pin,.tag').forEach(e=>e.remove());
  T.forEach((t,i)=>{
    const p=document.createElement('button');p.type='button';p.className='pin'+(sel!==null&&placed[i]===undefined?' armed':'');
    p.style.left=t.x+'%';p.style.top=t.y+'%';p.textContent=i+1;p.setAttribute('aria-label','Θέση '+(i+1));
    p.onclick=()=>place(i);board.appendChild(p);
    if(placed[i]!==undefined){
      const g=document.createElement('button');g.type='button';g.className='tag '+t.s;g.style.left=t.x+'%';g.style.top=t.y+'%';
      g.textContent=placed[i];g.onclick=()=>{words.push(placed[i]);delete placed[i];msg.textContent='';msg.className='msg';render()};
      board.appendChild(g);
    }
  });
  chipsEl.innerHTML='';
  words.forEach((w,k)=>{
    const c=document.createElement('button');c.type='button';c.className='chip'+(sel===k?' sel':'');c.textContent=w;
    c.onclick=()=>{sel=sel===k?null:k;render()};chipsEl.appendChild(c);
  });
  if(!words.length&&!chipsEl.children.length)chipsEl.innerHTML='<span>Όλες οι λέξεις μπήκαν! Πάτα «Έλεγχος».</span>';
}
function place(i){
  if(sel===null){msg.className='msg';msg.textContent='Διάλεξε πρώτα μια λέξη.';return}
  if(placed[i]!==undefined)words.push(placed[i]);
  placed[i]=words[sel];words.splice(sel,1);sel=null;msg.textContent='';msg.className='msg';render();
}
document.getElementById('check').onclick=()=>{
  let ok=0;const tags=board.querySelectorAll('.tag');
  T.forEach((t,i)=>{if(placed[i]===t.w)ok++});
  render();
  board.querySelectorAll('.tag').forEach(g=>{
    const i=T.findIndex(t=>g.style.left===t.x+'%'&&g.style.top===t.y+'%');
    g.classList.add(placed[i]===T[i].w?'ok':'bad');
  });
  const n=Object.keys(placed).length;
  if(ok===T.length){msg.className='msg win';msg.textContent='🌾 Μπράβο! Τα βρήκες όλα σωστά!'}
  else{msg.className='msg';msg.textContent='Σωστές: '+ok+' από '+T.length+'.'+(n<T.length?' Βάλε και τις υπόλοιπες λέξεις.':' Πάτα τις κόκκινες ετικέτες και ξαναδοκίμασε!')}
};
document.getElementById('reset').onclick=()=>{placed={};sel=null;words=shuffle(T.map(t=>t.w));msg.textContent='';msg.className='msg';render()};
render();
}
</script>
</body>
</html>
